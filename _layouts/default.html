<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
   <!-- Import local stylesheet  -->
    <link rel="stylesheet" href="{{ '/parasharvinay00.css' | relative_url }}">
   <style>
      .markdown-body h1 {
        color: #064406;
        font-family: system-ui;
      }
    </style>
    {% include head-custom.html %}
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      <header style="margin-bottom: 1.5rem;">
        {% if site.title %}
          <a href="/" style="
              text-align: left;
              width: 100%;
              display: block;
              color: darkgray;
          ">parasharvinay.github.io</a>
          <div style="display: flex; justify-content: left; gap: 0.7rem; flex-wrap: wrap; align-items: center;">
            <a href="{{ "/" | absolute_url }}">Home</a> |
            <div><a href="/articles">Essays</a></div> |
            <div><a href="/sites">Contact</a><div>
            <div><a target="_blank" href="https://github.com/parasharvinay00">Github</a> (<a target="_blank" href=https://github.com/parasharvinay00?tab=repositories&type=source>Repos</a>)</div>
          </div>
        {% endif %}

        <!-- ⚠️ Debugging values of page.title and site.title -->
        <!-- {% if page.title %} <div>page.title = {{ page.title }}</div> {% endif %} -->
        <!-- {% if site.title %} <div>site.title = {{ site.title }}</div> {% endif %} -->
      </header>


      {{ content }}

      <!-- Learn: I removed `and site.github.license` from below if condition because I don't have or need any license on my site code yet. -->
      {% if site.github.private != true %}
      <div class="footer border-top border-gray-light mt-5 pt-3 text-right text-gray">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>
  </body>
</html>
